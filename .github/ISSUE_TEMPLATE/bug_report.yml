name: Bug report
description: Help improve Gather with a reproducible issue.
title: "[Bug] "
body:
  - type: markdown
    attributes:
      value: "Never include API keys, tokens, or private event information. Use fictional data. Report security issues privately as described in SECURITY.md."
  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: "1. Open…\n2. Select…\n3. Observe…"
    validations:
      required: true
  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
    validations:
      required: true
  - type: textarea
    id: actual
    attributes:
      label: Actual behavior
    validations:
      required: true
  - type: input
    id: environment
    attributes:
      label: Browser and device
      placeholder: "Chrome on Android, Safari on macOS, etc."
  - type: textarea
    id: screenshots
    attributes:
      label: Screenshots or additional context
      description: "Hide all credentials and personal information before uploading."
